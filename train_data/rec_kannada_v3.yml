Global:
  use_gpu: false
  epoch_num: 150
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_kannada_v3
  save_epoch_step: 10
  eval_epoch_step: [0, 5]
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  save_inference_dir: ./output/rec_kannada_v3/infer
  use_visualdl: false
  character_dict_path: ppocr/utils/dict/ka_dict.txt
  character_type: ch
  max_text_length: 25
  rec_image_shape: "3, 48, 320"
  use_space_char: true

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 0.00001

Architecture:
  model_type: rec
  algorithm: SVTR
  Transform: null
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 64
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: C:/Users/Yeshwanth/OneDrive/Desktop/Fantacy/internship/project-2 (OCR)/train_data/kannada_rec/
    label_file_list: ["C:/Users/Yeshwanth/OneDrive/Desktop/Fantacy/internship/project-2 (OCR)/train_data/kannada_rec/ka_train.txt"]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: true
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: C:/Users/Yeshwanth/OneDrive/Desktop/Fantacy/internship/project-2 (OCR)/train_data/kannada_rec/
    label_file_list: ["C:/Users/Yeshwanth/OneDrive/Desktop/Fantacy/internship/project-2 (OCR)/train_data/kannada_rec/ka_train.txt"]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: false
    batch_size_per_card: 16
    drop_last: false
    num_workers: 0
